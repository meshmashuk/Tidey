<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="description" content="Tide times at nautical stations around the UK." />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon_48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon_180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tidey — UK Tide Times</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Defaults to dark
      // unless a light preference was saved. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          if (localStorage.getItem("tidey:theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
